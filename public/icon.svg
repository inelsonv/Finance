<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121815"/>
      <stop offset="100%" stop-color="#0a0f0d"/>
    </linearGradient>
    <linearGradient id="emblemGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glow" x1="256" y1="80" x2="256" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo base oscuro mate y elegante con curvatura refinada -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#1f2923" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="url(#glow)"/>

  <!-- Emblema Geométrico Central: Monograma SF de Tesorería Patrimonial -->
  <g transform="translate(48, 48) scale(10.4)">
    <!-- Barra superior de liquidez y bóveda -->
    <path
      d="M11 13.5C11 11.567 12.567 10 14.5 10H25.5C27.433 10 29 11.567 29 13.5V14.5H16.5C14.567 14.5 13 16.067 13 18V18H11V13.5Z"
      fill="url(#emblemGrad)"
    />

    <!-- Segmento central de transacción y equilibrio -->
    <path
      d="M13 18.5C13 17.119 14.119 16 15.5 16H25C26.105 16 27 16.895 27 18V19.5C27 20.881 25.881 22 24.5 22H15.5C14.119 22 13 20.881 13 19.5V18.5Z"
      fill="#f3f4f6"
    />

    <!-- Base de activos y crecimiento sostenido -->
    <path
      d="M11 26.5C11 24.567 12.567 23 14.5 23H27V26.5C27 28.433 25.433 30 23.5 30H14.5C12.567 30 11 28.433 11 26.5Z"
      fill="url(#emblemGrad)"
    />

    <!-- Indicador de pulso de precisión financiera -->
    <circle cx="27.5" cy="12.5" r="2.2" fill="#fbbf24"/>
  </g>
</svg>
