<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Fondo Azul Institucional bancario con profundidad -->
    <radialGradient id="bgRadial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f1d36"/>
      <stop offset="55%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#040711"/>
    </radialGradient>

    <!-- Resplandor central zafiro y cian -->
    <radialGradient id="blueGlow" cx="50%" cy="45%" r="44%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>

    <!-- Anillos concéntricos y bisel metálico institucional -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#1d4ed8" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Gradiente del emblema SF en Azul Institucional de alta precisión -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Gradiente de la barra central platino -->
    <linearGradient id="whiteBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Pulso dorado de tesorería y metas -->
    <radialGradient id="goldSphere" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Filtros de sombra y profundidad tridimensional -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020617" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Fondo completo (1024x1024) -->
  <rect width="1024" height="1024" fill="url(#bgRadial)"/>

  <!-- 2. Halo de resplandor zafiro/azul de fondo -->
  <circle cx="512" cy="450" r="430" fill="url(#blueGlow)"/>

  <!-- 3. Anillos perimetrales que marcan la zona circular de WhatsApp -->
  <circle cx="512" cy="512" r="460" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.45"/>
  <circle cx="512" cy="512" r="446" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3"/>

  <!-- 4. Contenedor de la insignia circular interna en azul medianoche -->
  <circle cx="512" cy="445" r="300" fill="#0b1329" stroke="url(#ringGrad)" stroke-width="4" filter="url(#dropShadow)"/>
  <circle cx="512" cy="445" r="296" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>

  <!-- 5. Emblema SF Monumental (Centrado dentro del círculo) -->
  <g transform="translate(142, 75) scale(20)" filter="url(#dropShadow)">
    <!-- Barra superior: Bóveda y liquidez -->
    <path
      d="M11 13.5C11 11.567 12.567 10 14.5 10H25.5C27.433 10 29 11.567 29 13.5V14.5H16.5C14.567 14.5 13 16.067 13 18V18H11V13.5Z"
      fill="url(#emblemGrad)"
    />

    <!-- Barra central diagonal: Transición y balance patrimonial -->
    <path
      d="M13 18.5C13 17.119 14.119 16 15.5 16H25C26.105 16 27 16.895 27 18V19.5C27 20.881 25.881 22 24.5 22H15.5C14.119 22 13 20.881 13 19.5V18.5Z"
      fill="url(#whiteBarGrad)"
    />

    <!-- Base inferior: Anclaje y solidez de activos -->
    <path
      d="M11 26.5C11 24.567 12.567 23 14.5 23H27V26.5C27 28.433 25.433 30 23.5 30H14.5C12.567 30 11 28.433 11 26.5Z"
      fill="url(#emblemGrad)"
    />

    <!-- Pulso dorado: Tesorería y rentabilidad -->
    <circle cx="27.5" cy="12.5" r="2.2" fill="url(#goldSphere)"/>
  </g>

  <!-- 6. Tipografía institucional "SMART FINANCE" -->
  <g text-anchor="middle">
    <!-- Título principal -->
    <text x="512" y="814" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="4">
      <tspan fill="#ffffff">SMART </tspan>
      <tspan fill="#38bdf8">FINANCE</tspan>
    </text>

    <!-- Lema solicitado: "PEQUEÑOS HÁBITOS, GRANDES RESULTADOS" -->
    <text x="512" y="864" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#cbd5e1" letter-spacing="4">
      PEQUEÑOS HÁBITOS, GRANDES RESULTADOS
    </text>
  </g>

  <!-- Micro acentos decorativos dorados en el lema -->
  <circle cx="168" cy="858" r="3" fill="#fbbf24" opacity="0.85"/>
  <circle cx="856" cy="858" r="3" fill="#fbbf24" opacity="0.85"/>
</svg>
